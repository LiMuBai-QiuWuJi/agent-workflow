<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多 Agent 团队编排 · 运行视图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070a11;
    --panel: rgba(255, 255, 255, 0.028);
    --panel-solid: #10141f;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.14);
    --text: #e6eaf2;
    --muted: #8b93a7;
    --active: #3b82f6;
    --done: #22c55e;
    --fail: #ef4444;
    --pending: #39415a;
    --font-latin: "Space Grotesk", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    overflow-x: hidden;
  }
  /* 环境背景：深层径向辉光 + 细网格，避免平涂 */
  .ambient {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(52rem 34rem at 82% -8%, rgba(59, 130, 246, 0.14), transparent 62%),
      radial-gradient(44rem 30rem at 8% 22%, rgba(168, 85, 247, 0.09), transparent 60%),
      radial-gradient(40rem 26rem at 55% 108%, rgba(34, 197, 94, 0.06), transparent 62%),
      var(--bg);
  }
  .ambient::after {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse 90% 70% at 50% 20%, #000 30%, transparent 75%);
  }
  main { overflow-x: hidden; width: 100%; max-width: 100%; }

  /* ===== 悬浮玻璃胶囊导航 ===== */
  .nav-pill {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    z-index: 60; display: flex; align-items: center; gap: 18px;
    padding: 10px 12px 10px 22px; border-radius: 999px;
    background: rgba(13, 17, 27, 0.72);
    border: 1px solid var(--border-strong);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    white-space: nowrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-latin); font-weight: 700; font-size: 15px; letter-spacing: 0.02em; }
  .brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--pending); transition: background .3s, box-shadow .3s; }
  .brand.live .dot { background: var(--done); box-shadow: 0 0 10px rgba(34, 197, 94, 0.8); }
  #status { font-size: 12px; color: var(--muted); max-width: 38vw; overflow: hidden; text-overflow: ellipsis; }
  #hamburger {
    font-size: 16px; line-height: 1; padding: 8px 14px; border-radius: 999px;
    background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid var(--border);
    cursor: pointer; transition: border-color .2s, background .2s;
  }
  #hamburger:hover { border-color: var(--active); background: rgba(59,130,246,0.12); }

  /* ===== Hero：居中控车指令台（宽排印，H1 至多两行） ===== */
  .hero {
    padding: 140px 24px 56px; text-align: center;
    display: flex; flex-direction: column; align-items: center;
  }
  .hero h1 {
    margin: 0; max-width: 52rem; width: 100%;
    font-family: var(--font-latin);
    font-size: clamp(2rem, 4.4vw, 3.4rem);
    line-height: 1.18; font-weight: 700; letter-spacing: -0.01em;
    background: linear-gradient(180deg, #ffffff 30%, #9fb0cc 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero .sub {
    margin: 18px 0 0; max-width: 44rem;
    color: var(--muted); font-size: 15px; line-height: 1.8;
  }
  /* 指令台：唯一的行动入口 */
  .console {
    margin-top: 40px; width: min(46rem, 92vw);
    display: flex; align-items: center; gap: 12px;
    padding: 8px 8px 8px 22px; border-radius: 18px;
    background: rgba(16, 20, 31, 0.85);
    border: 1px solid var(--border-strong);
    box-shadow: 0 0 0 0 rgba(59, 130, 246, 0);
    transition: box-shadow .3s, border-color .3s;
  }
  .console:focus-within {
    border-color: rgba(59, 130, 246, 0.65);
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.14), 0 18px 50px rgba(0,0,0,0.4);
  }
  .console .prompt { color: var(--active); font-family: var(--font-latin); font-weight: 700; font-size: 18px; user-select: none; }
  #req {
    flex: 1; min-width: 0; padding: 12px 0; border: 0; outline: 0; background: transparent;
    color: var(--text); font-size: 15px; font-family: inherit;
  }
  #req:disabled { color: var(--muted); }
  #req::placeholder { color: #5b6478; }

  /* ===== Bento 工作区：无缝网格，双卡交错，零空位 ===== */
  .workspace {
    display: grid; grid-template-columns: repeat(12, 1fr);
    grid-auto-flow: dense; gap: 18px;
    width: min(76rem, 94vw); margin: 0 auto;
    padding: 24px 0 96px;
  }
  .chart-card {
    grid-column: span 12;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 18px; padding: 18px 20px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: transform .5s cubic-bezier(.2,.7,.2,1), border-color .3s, box-shadow .3s;
  }
  .chart-card:hover {
    transform: translateY(-3px);
    border-color: rgba(255,255,255,0.16);
    box-shadow: 0 24px 60px rgba(0,0,0,0.35);
  }
  .chart-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
  .chart-title { font-size: 15px; font-weight: 600; font-family: var(--font-latin); letter-spacing: 0.01em; }
  .chart-hint { font-size: 12px; color: var(--muted); }
  svg { width: 100%; height: auto; display: block; }
  /* 总览节点状态 */
  .ov-node rect { fill: #1c2436; stroke: var(--pending); stroke-width: 1.5; transition: all .3s; }
  .ov-node text { fill: var(--muted); font-size: 14px; text-anchor: middle; transition: fill .3s; }
  .ov-node.active rect { fill: #12315e; stroke: var(--active); filter: drop-shadow(0 0 6px rgba(59,130,246,.7)); }
  .ov-node.active text { fill: #fff; }
  .ov-node.done rect { fill: #0f2e1c; stroke: var(--done); }
  .ov-node.done text { fill: var(--done); }
  .ov-node.fail rect { fill: #3a1518; stroke: var(--fail); }
  .ov-node.fail text { fill: var(--fail); }
  /* 轨迹节点 */
  .tr-node rect { fill: #1c2436; stroke: var(--pending); stroke-width: 1.5; }
  .tr-node text { fill: var(--text); font-size: 12px; text-anchor: middle; }
  .tr-node .sub { fill: var(--muted); font-size: 10px; }
  .tr-node.end-ok rect { fill: #0f2e1c; stroke: var(--done); }
  .tr-node.end-bad rect { fill: #3a1518; stroke: var(--fail); }
  .tr-edge { stroke: var(--pending); stroke-width: 1.5; fill: none; }
  .tr-edge.back { stroke-width: 2; stroke-dasharray: 6 4; }
  .tr-label { font-size: 11px; text-anchor: middle; }
  /* Mermaid 总览图：实时亮灯态 */
  .ov-tools { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .ov-tools button {
    padding: 2px 12px; font-size: 13px; line-height: 1.6; border-radius: 8px;
    background: rgba(255,255,255,0.05); color: var(--text); border: 1px solid var(--border);
    cursor: pointer; transition: border-color .2s;
  }
  .ov-tools button:hover { border-color: var(--active); }
  .ov-tools .hint { font-size: 11px; color: var(--muted); }
  #ov-zoom { overflow: auto; max-height: 62vh; border-radius: 12px; }
  #ov-mermaid { transform-origin: 0 0; transition: transform .12s ease-out; display: inline-block; min-width: 100%; }
  #ov-mermaid svg { max-width: none !important; width: 100%; height: auto; display: block; }
  g.node rect, g.node polygon { transition: stroke .3s; }
  g.node.lit-active rect, g.node.lit-active polygon {
    stroke: var(--active) !important; stroke-width: 3px !important;
    filter: drop-shadow(0 0 8px rgba(59,130,246,.8));
    animation: litPulse 1.4s ease-in-out infinite;
  }
  g.node.lit-done rect, g.node.lit-done polygon {
    stroke: var(--done) !important; stroke-width: 3px !important; }
  g.node.lit-fail rect, g.node.lit-fail polygon {
    stroke: var(--fail) !important; stroke-width: 3px !important;
    filter: drop-shadow(0 0 8px rgba(239,68,68,.8)); }
  @keyframes litPulse {
    0%, 100% { filter: drop-shadow(0 0 6px rgba(59,130,246,.7)); }
    50%      { filter: drop-shadow(0 0 14px rgba(59,130,246,1)); }
  }
  /* 汉堡抽屉：配置编辑 + 演示回放都收进右上角菜单 */
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.55);
          opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 70; }
  .mask.open { opacity: 1; pointer-events: auto; }
  aside.drawer { position: fixed; top: 0; right: 0; height: 100vh; width: 400px;
                 max-width: 94vw; background: var(--panel-solid); border-left: 1px solid var(--border-strong);
                 z-index: 80; transform: translateX(102%);
                 transition: transform .25s ease-out; padding: 20px 22px; overflow-y: auto; }
  aside.drawer.open { transform: translateX(0); }
  aside.drawer .sec-title { font-size: 13px; color: var(--muted); margin: 22px 0 8px; }
  aside.drawer .sec-title:first-child { margin-top: 0; }
  #configEdit { width: 100%; min-height: 340px; background: #0b0f18; color: var(--text);
                border: 1px solid var(--border); border-radius: 10px; padding: 12px;
                font-family: Consolas, monospace; font-size: 12px; line-height: 1.6;
                resize: vertical; }
  #configEdit[readonly] { color: var(--muted); }
  #cfgRow { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
  #cfgHint { font-size: 11px; color: var(--muted); }
  #replayRow { display: flex; gap: 8px; }
  #replayRow select { flex: 1; }
  button.act {
    padding: 9px 18px; border-radius: 10px; border: 1px solid var(--border-strong);
    background: rgba(59, 130, 246, 0.16); color: #cfe0ff; font-size: 13px; cursor: pointer;
    transition: background .2s, border-color .2s;
  }
  button.act:hover { background: rgba(59, 130, 246, 0.3); border-color: var(--active); }
  select, button.ghost { padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border);
         background: #0b0f18; color: var(--text); font-size: 13px; cursor: pointer; }
  select:hover, button.ghost:hover { border-color: var(--active); }
  /* 底部行动条 */
  .foot {
    width: min(76rem, 94vw); margin: 0 auto; padding: 0 0 48px;
    display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    color: var(--muted); font-size: 12px;
  }
  /* 入场动画（GSAP 在时交给 GSAP，不在时走 CSS 兜底） */
  .rise { opacity: 0; transform: translateY(18px); }
  .rise.in { opacity: 1; transform: none; transition: opacity .6s ease, transform .6s cubic-bezier(.2,.7,.2,1); }

  /* ===== 结果弹窗：产出说明 / 失败说明 ===== */
  #resultMask {
    position: fixed; inset: 0; z-index: 90;
    background: rgba(4, 6, 10, 0.6);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center; padding: 24px;
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  #resultMask.open { opacity: 1; pointer-events: auto; }
  #resultCard {
    width: min(42rem, 94vw); max-height: 84vh; overflow-y: auto;
    background: linear-gradient(180deg, #131824 0%, #0d1119 100%);
    border-radius: 20px; padding: 28px 30px 24px;
    position: relative;
    box-shadow: 0 40px 120px rgba(0,0,0,0.6);
    transform: translateY(26px) scale(0.94); opacity: 0;
  }
  #resultMask.open #resultCard {
    transform: none; opacity: 1;
    transition: transform .45s cubic-bezier(.16, 1.2, 0.3, 1), opacity .3s ease;
  }
  #resultCard.ok { border: 1px solid rgba(34, 197, 94, 0.35); box-shadow: 0 40px 120px rgba(0,0,0,.6), 0 0 60px rgba(34,197,94,.10); }
  #resultCard.bad { border: 1px solid rgba(239, 68, 68, 0.4); box-shadow: 0 40px 120px rgba(0,0,0,.6), 0 0 60px rgba(239,68,68,.12); }
  #resultClose {
    position: absolute; top: 14px; right: 14px;
    width: 32px; height: 32px; border-radius: 50%;
    border: 1px solid var(--border); background: rgba(255,255,255,0.04);
    color: var(--muted); font-size: 15px; cursor: pointer; line-height: 1;
    transition: color .2s, border-color .2s;
  }
  #resultClose:hover { color: var(--text); border-color: var(--border-strong); }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
    padding: 5px 14px; border-radius: 999px; margin-bottom: 14px;
  }
  .badge .b-dot { width: 7px; height: 7px; border-radius: 50%; }
  #resultCard.ok .badge { color: #7ee2a8; background: rgba(34,197,94,.10); border: 1px solid rgba(34,197,94,.3); }
  #resultCard.ok .badge .b-dot { background: var(--done); box-shadow: 0 0 8px rgba(34,197,94,.9); }
  #resultCard.bad .badge { color: #f3a6ab; background: rgba(239,68,68,.10); border: 1px solid rgba(239,68,68,.35); }
  #resultCard.bad .badge .b-dot { background: var(--fail); box-shadow: 0 0 8px rgba(239,68,68,.9); }
  #resultCard.direct { border: 1px solid rgba(59, 130, 246, 0.4); box-shadow: 0 40px 120px rgba(0,0,0,.6), 0 0 60px rgba(59,130,246,.12); }
  #resultCard.direct .badge { color: #9ec2ff; background: rgba(59,130,246,.10); border: 1px solid rgba(59,130,246,.35); }
  #resultCard.direct .badge .b-dot { background: var(--active); box-shadow: 0 0 8px rgba(59,130,246,.9); }
  .direct-answer { font-size: 14px; line-height: 2; color: #c9d4e6; margin: 0; white-space: pre-wrap; word-break: break-word; }
  #resultTitle { margin: 0 0 6px; font-size: 20px; font-weight: 700; font-family: var(--font-latin); letter-spacing: 0.01em; }
  #resultSummary { margin: 0 0 18px; color: var(--muted); font-size: 13px; line-height: 1.7; }
  .file-entry {
    display: grid; grid-template-columns: 4px 1fr; gap: 14px;
    padding: 14px 0; border-top: 1px solid rgba(255,255,255,0.06);
  }
  .file-entry .bar { width: 4px; border-radius: 4px; background: linear-gradient(180deg, var(--active), rgba(59,130,246,.25)); }
  .file-entry .fname { font-size: 15px; font-weight: 600; font-family: var(--font-latin); }
  .file-entry .fpath { font-family: Consolas, monospace; font-size: 12px; color: var(--muted); margin: 3px 0 8px; word-break: break-all; }
  .file-tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .ftag { font-size: 11px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border-strong); color: #c6cede; background: rgba(255,255,255,0.04); }
  .ftag.core { color: #9ec2ff; border-color: rgba(59,130,246,.45); background: rgba(59,130,246,.10); }
  .fuse { margin-top: 8px; font-size: 12px; color: #9aa5ba; line-height: 1.7; }
  .fuse b { color: #c9d4e6; font-weight: 600; }
  .fail-reason {
    margin: 4px 0 12px; padding: 14px 16px; border-radius: 12px;
    background: rgba(239,68,68,.07); border: 1px solid rgba(239,68,68,.25);
    color: #f0c4c7; font-size: 13px; line-height: 1.8;
  }
  .fail-advice { font-size: 13px; color: #9aa5ba; line-height: 1.8; margin: 0 0 12px; }
  .fail-advice b { color: #c9d4e6; }
  #resultRaw summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  #resultRaw pre {
    margin: 0; padding: 14px; border-radius: 12px; overflow-x: auto;
    background: #090c13; border: 1px solid var(--border);
    font-size: 11px; line-height: 1.7; color: #97a2b8; white-space: pre-wrap; word-break: break-all;
  }
  #resultFoot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"
        onerror="window.__gsapFailed=true"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.3/dist/mermaid.min.js"
        onerror="window.__mermaidFailed=true"></script>
</head>
<body>
<div class="ambient"></div>
<main>
  <nav class="nav-pill rise" id="navPill">
    <span class="brand" id="brand"><span class="dot"></span>Agent Workflow<span style="color:var(--muted);font-weight:400">· 运行视图</span></span>
    <span id="status">就绪</span>
    <button id="hamburger" title="配置与演示回放">☰</button>
  </nav>

  <section class="hero">
    <h1 class="rise">多 Agent 团队编排<br>实时运行视图</h1>
    <p class="sub rise">一句需求进入调度岗，拆解、派发、评审、核验全链路在两张图上实时生长。<br>浏览器与终端共用同一调度入口，事件流即真相。</p>
    <div class="console rise">
      <span class="prompt">&gt;_</span>
      <input id="req" placeholder="输入需求，回车运行（FastAPI+SSE 接入后开放）" disabled>
    </div>
  </section>

  <section class="workspace">
    <div class="chart-card rise">
      <div class="chart-head">
        <span class="chart-title">编排全景</span>
        <span class="chart-hint">当前阶段亮灯，与工程档案流程图同源同图例</span>
        <span class="ov-tools">
          <button id="ovOut" title="缩小">－</button>
          <button id="ovReset" title="复位">1:1</button>
          <button id="ovIn" title="放大">＋</button>
          <span id="ovScaleVal" class="hint">100%</span>
          <span class="hint">滚轮缩放 · 边缘滚动平移</span>
        </span>
      </div>
      <div id="ov-zoom"><div id="ov-mermaid"></div></div>
      <svg id="overview" viewBox="0 0 720 170" style="display:none"></svg>
    </div>
    <div class="chart-card rise">
      <div class="chart-head">
        <span class="chart-title">运行轨迹</span>
        <span class="chart-hint">本次运行走过的路径，退回带循环编号与颜色回边</span>
      </div>
      <svg id="trace" viewBox="0 0 720 460"></svg>
    </div>
  </section>

  <footer class="foot rise">
    <span>调度蓝 · 岗位琥珀 · 核验紫 · 失败红 · 闭环绿</span>
    <span>直播与终端同一底层 · 录播仅演示用</span>
  </footer>
</main>
<div id="mask" class="mask"></div>
<aside id="drawer" class="drawer">
  <div class="sec-title">运行配置（run_config.txt，可编辑）</div>
  <textarea id="configEdit" readonly>加载中……</textarea>
  <div id="cfgRow">
    <button id="btnSaveCfg" class="act">保存配置</button>
    <span id="cfgHint">保存后需重启服务生效</span>
  </div>
  <div class="sec-title">演示回放（录播，仅演示用）</div>
  <div id="replayRow">
    <select id="replaySel">
      <option value="replay.jsonl">真实运行（退回 0 次）</option>
      <option value="replay_reject.jsonl">含退回循环（退回 2 次）</option>
    </select>
    <button id="btnReplay" class="act">重播</button>
    <button id="btnClear" class="act">清除</button>
  </div>
</aside>
<div id="resultMask">
  <div id="resultCard" role="dialog" aria-modal="true">
    <button id="resultClose" title="关闭">✕</button>
    <div class="badge"><span class="b-dot"></span><span id="badgeText"></span></div>
    <h2 id="resultTitle"></h2>
    <p id="resultSummary"></p>
    <div id="resultBody"></div>
    <div id="resultFoot"><button id="resultOk" class="act">知道了</button></div>
  </div>
</div>
<script>
"use strict";
const SVGNS = "http://www.w3.org/2000/svg";
const ROUND_COLOR = { 1: "#3b82f6", 2: "#f59e0b" };
const roundColor = n => ROUND_COLOR[n] || "#ef4444";

function el(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

/* ================= 总览图：Mermaid 专业流程图（CDN 失败回退手绘版） ================= */
/* 与 工程档案 08-流程图记录.md 图一同一图例：蓝=调度代码 黄=岗位执行 紫=交付核验 红=失败 绿=闭环 */
const OV_MMD = `flowchart TD
    A["需求输入<br/>终端 或 POST /run"]:::code --> B["调度岗拆解 LLM<br/>编制表 + 需求 → 任务表"]:::llm
    B -- "契约违约" --> B1["判失败：打印调度现场"]:::fail
    B --> C["任务表解析校验（纯代码）<br/>编号 / 岗位 / 评审对象 / 依赖"]:::code
    C --> D["按任务表派发 任务#N<br/>自包含任务描述"]:::code
    D --> P1["分析型任务直发（无评审配对）<br/>如只读资料分析"]:::code
    P1 --> P2["岗位执行（任务表指定·只读）<br/>LLM + 工具 read_file"]:::llm
    P2 --> P3["产出回执：原样回灌调度岗记忆"]:::code
    P3 --> P4["调度岗面向用户总结"]:::llm
    P4 --> O
    D --> E["岗位执行（任务表指定）<br/>LLM + 工具 write_file"]:::llm
    E --> F{"解析协作信号（纯代码）"}:::code
    F -- "无信号" --> F1["终止：无法进入评审"]:::fail
    F -- "解析到" --> G["配对评审任务派发<br/>评审岗由任务表指定"]:::code
    G --> H["评审执行（任务表指定）<br/>LLM + 工具 read_file / run_cmd"]:::llm
    H --> I{"解析评审结论（纯代码）"}:::code
    I -- "缺失" --> I1["视为不通过<br/>契约即合同"]:::code
    I -- "通过/不通过" --> J{"结论 = 通过 ?"}:::code
    I1 --> J
    J -- "不通过" --> K{"退回计数<br/>dict 任务id · MAX_REJECT=2"}:::code
    K -- "超上限" --> K1["判失败终止<br/>打印双方现场"]:::fail
    K -- "未超" --> L["打包退回任务（自包含）<br/>原产出 + 问题清单 + 第N次退回"]:::code
    L -- "受控循环：同一协作边往返" --> E
    J -- "通过" --> M["交付核验 verify_delivery<br/>纯代码零 LLM · 逐项 isfile"]:::verify
    M --> N{"声明文件全在盘上 ?"}:::code
    N -- "空清单 / 缺失" --> N1["判失败：契约违约 / 假完成"]:::fail
    N -- "全在" --> O["闭环成功<br/>退回N次 · 核验通过M个文件"]:::ok
    classDef code fill:#16202f,stroke:#3b82f6,color:#c7d5ea
    classDef llm fill:#241d10,stroke:#f59e0b,color:#e8d5b0

    classDef fail fill:#2b1215,stroke:#ef4444,color:#f3b3b7

/* 事件键 → Mermaid 节点 id（亮灯映射） */
const OV_MAP = { plan: ["B"], analyze: ["P2"], code: ["E"], review: ["H"],
                 verify: ["M"], summary: ["P4"], done: ["O"] };

let ovMode = "pending";       // mermaid | fallback
const ovState = {};           // 兜底模式的状态表（沿用原实现）
let ovLit = [];               // mermaid 模式下当前亮着的节点

function ovNode(id) {
  return document.querySelector(`#ov-mermaid svg [id^="flowchart-${id}-"]`);
}

async function initOverview() {
  try {
    if (window.__mermaidFailed || !window.mermaid) throw new Error("mermaid CDN 未加载");
    mermaid.initialize({
      startOnLoad: false, securityLevel: "loose", theme: "base",
      flowchart: { curve: "basis", htmlLabels: true },
      themeVariables: {
        background: "#10141f", primaryColor: "#1c2436", primaryTextColor: "#dbe2ee",
        primaryBorderColor: "#3a4358", lineColor: "#3a4358", edgeLabelBackground: "#10141f",
        fontSize: "13px",
      },
    });
    const { svg } = await mermaid.render("ovgraph", OV_MMD);
    document.getElementById("ov-mermaid").innerHTML = svg;
    ovMode = "mermaid";
  } catch (err) {
    ovMode = "fallback";      // CDN 不可用：退回手绘简版，功能不丢
    document.getElementById("ov-mermaid").style.display = "none";
    document.getElementById("overview").style.display = "";
    buildFallbackOverview();
  }
}

function ovSet(key, state) {
  if (ovMode === "mermaid") {
    for (const n of ovLit) n.classList.remove("lit-active", "lit-done", "lit-fail");
    ovLit = [];
    if (state === "pending") return;
    for (const id of (OV_MAP[key] || [])) {
      const n = ovNode(id);
      if (n) { n.classList.add("lit-" + state); ovLit.push(n); }
    }
    return;
  }
  ovState[key] = state;
  const g = document.getElementById("ov-" + key);
  if (g) g.setAttribute("class", "ov-node" + (state === "pending" ? "" : " " + state));
}

function ovLoop(round) {
  if (ovMode === "mermaid") {
    const n = ovNode("K");    // 退回计数 diamond 按轮次着色点亮
    if (n) {
      n.classList.add("lit-active");
      ovLit.push(n);
    }
    return;
  }
  const p = document.getElementById("ov-loop");
  const t = document.getElementById("ov-loop-label");
  p.setAttribute("stroke", roundColor(round));
  p.setAttribute("opacity", 1);
  t.setAttribute("fill", roundColor(round));
  t.setAttribute("opacity", 1);
  t.textContent = "退回 #" + round;
}

/* ================= 轨迹图：按时间生长，退回画彩色回边 ================= */
const trace = document.getElementById("trace");
const TR_COLS = { plan: 90, code: 250, review: 410, verify: 540, end: 660 };
/* 泳道系统：plan 事件的 roles 编制表 + 任务表驱动，新增岗位前端零改动。
   旧录播没有 roles 字段时回退到 TR_COLS 默认布局与 key 本身。 */
let teamInfo = {};                 // 岗位 key → 显示名（roles 编制表）
let taskRole = {};                 // task_id → 岗位 key（泳道归属）
let lanes = ["plan", "code", "review", "verify", "end"];   // 泳道键（按任务首次出现顺序）
let laneX = { ...TR_COLS };        // 泳道键 → x 坐标
const TR_HEAD_LABEL = { plan: "调度", verify: "交付核验", end: "完成" };
let trPrev = null;      // 上一个节点 {x,y}
let trRow = 0;

function roleName(k) { return teamInfo[k] || k; }

function trDrawLanes() {
  const old = document.getElementById("tr-head");
  if (old) old.remove();
  const g = el("g", { id: "tr-head" }, trace);
  for (const k of lanes) {
    const t = el("text", { x: laneX[k], y: 24, "text-anchor": "middle",
                           fill: "#8a94a8", "font-size": 12 }, g);
    t.textContent = TR_HEAD_LABEL[k] || roleName(k);
  }
}

function resetLanes() {
  teamInfo = {};
  taskRole = {};
  lanes = ["plan", "code", "review", "verify", "end"];
  laneX = { ...TR_COLS };
}

function trAddNode(colKey, label, sub, opts = {}) {
  const x = laneX[colKey] ?? TR_COLS[colKey];
  const y = 84 + trRow * 66;
  trRow++;
  const g = el("g", { class: "tr-node" + (opts.end ? " " + opts.end : "") }, trace);
  el("rect", { x: x - 55, y: y - 20, width: 110, height: 42, rx: 9 }, g);
  el("text", { x: x, y: y - 2 }, g).textContent = label;
  if (sub) el("text", { class: "sub", x: x, y: y + 14 }, g).textContent = sub;

  if (trPrev) {
    const from = trPrev, to = { x, y };
    let mid;
    if (opts.back) {
      // 退回回边：从上个节点弯回编码列，颜色=循环轮次
      const c = roundColor(opts.back);
      const d = `M${from.x},${from.y + 21} C${from.x},${(from.y + to.y) / 2} ` +
                `${to.x},${(from.y + to.y) / 2} ${to.x},${to.y - 22}`;
      el("path", { d, class: "tr-edge back", stroke: c }, trace);
      mid = { x: (from.x + to.x) / 2, y: (from.y + to.y) / 2 };
      const lb = el("text", { class: "tr-label", x: mid.x, y: mid.y - 6, fill: c }, trace);
      lb.textContent = "退回 #" + opts.back;
    } else {
      el("line", { x1: from.x, y1: from.y + 21, x2: to.x, y2: to.y - 22,
                   class: "tr-edge" }, trace);
      if (opts.edgeLabel) {
        mid = { x: (from.x + to.x) / 2, y: (from.y + to.y) / 2 };
        const lb = el("text", { class: "tr-label", x: mid.x, y: mid.y - 6,
                                fill: "#8a94a8" }, trace);
        lb.textContent = opts.edgeLabel;
      }
    }
  }
  trPrev = { x, y };
  trace.setAttribute("viewBox", `0 0 720 ${Math.max(460, y + 70)}`);
}

  "调度":   { name: "需求拆解与任务分派", advice: "需求未能按约定格式拆成可执行的任务表。可调整需求表述、缩小范围后重试。" },
  "编码":   { name: "开发执行",           advice: "执行岗位运行出错。查看下方原始现场定位原因；若是输出超长被截断，直接重试通常即可恢复。" },
  "评审":   { name: "质量评审",           advice: "评审环节运行出错。查看下方原始现场；若是输出超长被截断，重试通常可恢复。" },
  "交付核验": { name: "交付物核验",      advice: "声明的交付文件未在盘上找到，已按假完成拦截。建议缩小需求范围或换一种表述重试。" },
  "系统":   { name: "系统运行",           advice: "发生未预期异常。查看下方原始现场，若反复出现请检查服务配置。" },
};

/* 扩展名 → 使用建议 */
function usageHint(path) {
  const name = basename(path);
  const ext = name.includes(".") ? name.split(".").pop().toLowerCase() : "";
  if (/^test_.*\.py$|_test\.py$/.test(name)) return "评审用例，终端运行 <b>python -m pytest " + name + "</b> 执行";
  if (ext === "py")    return "Python 模块，终端运行 <b>python " + name + "</b> 查看效果";
  if (ext === "md")    return "Markdown 文档，用编辑器或浏览器直接打开阅读";
  if (ext === "txt")   return "纯文本文件，直接打开阅读";
  if (ext === "json" || ext === "jsonl") return "数据文件，供程序读取处理";
  if (ext === "csv")   return "表格数据，可用 Excel 或直接以文本打开";
  if (ext === "html")  return "网页文件，浏览器直接打开查看";
  return "按项目目录结构使用";
}

/* 文件名 → 用途标签（命中任务表核心交付物 / 测试 / 附属） */
function purposeOf(path) {
  const name = basename(path);
  const hit = runTasks.find(t => t.deliverable && basename(t.deliverable) === name);
  if (hit) return { cls: "core", text: "核心交付物 · " + hit.id };
  if (/^test_|_test\.|test\./.test(name)) return { cls: "", text: "评审用例" };
  return { cls: "", text: "附属产出" };
}

function showResultDirect(e) {
  document.getElementById("badgeText").textContent = "直接回复";
  document.getElementById("resultTitle").textContent = "调度岗直接答复";
  document.getElementById("resultSummary").textContent =
    "该需求无需进入任务编排，调度岗已直接回答。如需落地实现，请描述具体的代码需求。";
  const body = document.getElementById("resultBody");
  body.innerHTML = '<p class="direct-answer"></p>';
  body.querySelector(".direct-answer").textContent = e.answer || "（无内容）";
  resultCard.className = "direct";
  resultCard.id = "resultCard";
  resultMask.classList.add("open");
}

function closeResult() {
  resultMask.classList.remove("open");
}

function showResultOk(e) {
  const files = e.declared || [];
  const root = e.root || "";
  document.getElementById("badgeText").textContent = "运行成功";
  document.getElementById("resultTitle").textContent = "本次产出说明";
  document.getElementById("resultSummary").textContent =
    "闭环成功 · 退回 " + (e.rejects ?? 0) + " 次 · 核验通过 " + files.length + " 个文件。" +
    (root
      ? "以下文件已生成，路径为完整绝对路径，可直接在文件管理器中定位。"
      : "以下文件已生成在项目工作区，路径相对项目根目录。");
  const body = document.getElementById("resultBody");
  body.innerHTML = "";
  for (const p of files) {
    const pur = purposeOf(p);
    const absPath = root ? root + "\\" + p.replace(/\//g, "\\") : p;
    const row = document.createElement("div");
    row.className = "file-entry";
    row.innerHTML =
      '<span class="bar"></span><div>' +
      '<div class="fname"></div>' +
      '<div class="fpath"></div>' +
      '<div class="file-tags"><span class="ftag ' + pur.cls + '"></span></div>' +
      '<div class="fuse">' + usageHint(p) + "</div></div>";
    row.querySelector(".fname").textContent = basename(p);
    row.querySelector(".fpath").textContent = absPath;
    row.querySelector(".fpath").title = absPath;
    row.querySelector(".ftag").textContent = pur.text;
    body.appendChild(row);
  }
  resultCard.className = "ok";
  resultCard.id = "resultCard";
  resultMask.classList.add("open");
}

function showResultSummary(e) {
  document.getElementById("badgeText").textContent = "运行完成";
  document.getElementById("resultTitle").textContent = "调度岗总结";
  document.getElementById("resultSummary").textContent =
    "分析类任务已完成，以下为调度岗面向用户的总结。";
  const body = document.getElementById("resultBody");
  body.innerHTML = '<p class="direct-answer"></p>';
  body.querySelector(".direct-answer").textContent = e.text || "（无内容）";
  resultCard.className = "direct";
  resultCard.id = "resultCard";
  resultMask.classList.add("open");
}

function showResultFail(e) {
  const st = STAGE_MANUAL[e.stage] || STAGE_MANUAL["系统"];
  document.getElementById("badgeText").textContent = "运行失败";
  document.getElementById("resultTitle").textContent = "失败说明 · " + st.name;
  document.getElementById("resultSummary").textContent = "";
  const body = document.getElementById("resultBody");
  body.innerHTML =
    '<div class="fail-reason"></div>' +
    '<p class="fail-advice"><b>建议：</b>' + st.advice + "</p>" +
    '<details id="resultRaw"><summary>查看原始现场</summary><pre></pre></details>';
  body.querySelector(".fail-reason").textContent = e.reason || "未提供原因";
  body.querySelector("#resultRaw pre").textContent = e.raw || "（无原始现场记录）";
  resultCard.className = "bad";
  resultCard.id = "resultCard";
  resultMask.classList.add("open");
}

resultMask.addEventListener("click", (ev) => { if (ev.target === resultMask) closeResult(); });
document.getElementById("resultClose").addEventListener("click", closeResult);
document.getElementById("resultOk").addEventListener("click", closeResult);
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") closeResult(); });

function applyEvent(e) {
  statusEl.textContent = `#${e.seq} ${e.event}` +
    (e.task_id ? ` · ${e.task_id}` : "");
  switch (e.event) {
    case "plan": {
      runTasks = e.tasks || [];
      teamInfo = {};
      for (const r of (e.roles || [])) teamInfo[r.key] = r.name;
      taskRole = {};
      for (const t of runTasks) taskRole[t.id] = t.role;
      // 泳道 = 调度 + 任务表实际用到的岗位（按首次出现顺序）+ 交付核验 + 完成
      const seen = [];
      for (const t of runTasks) if (!seen.includes(t.role)) seen.push(t.role);
      lanes = ["plan", ...seen, "verify", "end"];
      laneX = {};
      lanes.forEach((k, i) => {
        laneX[k] = 90 + i * (620 / Math.max(1, lanes.length - 1));
      });
      trDrawLanes();
      ovSet("plan", "done");
      trAddNode("plan", "调度拆解", `${runTasks.length} 个任务`);
      break;
    }
    case "task_start": {
      // 无交付物的任务是分析型（如助理岗）：亮分析分支而非产出型分支
      const pt = runTasks.find(x => x.id === e.task_id);
      if (pt && !pt.deliverable) ovSet("analyze", "active");
      else ovSet("code", "active");
      const role = taskRole[e.task_id] || "code";
      trAddNode(role, roleName(role) + " " + e.task_id, e.role ? roleName(e.role) : "");
      break;
    }
    case "dispatch":
      ovSet("code", "active");
      break;                       // 轨迹节点已在 task_start 落过（退回后的重派不新增）
    case "review": {
      ovSet("review", "active");
      const role = taskRole[e.task_id] || "review";
      trAddNode(role, roleName(role) + " " + e.task_id, e.role ? roleName(e.role) : "");
      break;
    }
    case "verdict":
      if (e.verdict === "通过") {
        ovSet("review", "done");
        ovSet("verify", "active");
      } else {
        ovSet("review", "done");
      }
      break;
    case "reject": {
      ovSet("code", "active");
      ovLoop(e.round);
      const role = taskRole[e.task_id] || "code";
      trAddNode(role, roleName(role) + " " + e.task_id,
                "第 " + e.round + " 次修改", { back: e.round });
      break;
    }
    case "truncation_recover": {
      const role = taskRole[e.task_id] || "review";
      trAddNode(role, "截断补发", e.task_id);
      break;
    }
    case "verified":
      ovSet("verify", "done");
      trAddNode("verify", "交付核验", (e.declared || []).length + " 个文件");
      break;
    case "summary":
      ovSet("analyze", "done");
      if (resultMask.classList.contains("open")) {
        // 混合任务：done 弹窗已开，总结追加进现有弹窗，不重复画终点节点
        const p = document.createElement("p");
        p.className = "direct-answer";
        p.textContent = e.text || "";
        document.getElementById("resultBody").appendChild(p);
      } else {
        ovSet("summary", "done");
        ovSet("done", "done");
        trAddNode("end", "✓ 完成", "分析类任务 · 已总结", { end: "end-ok" });
        showResultSummary(e);
      }
      break;
    case "usage":
      lastBill = `本轮账单：${e.calls} 次调用 · prompt ${e.prompt} + completion ${e.completion} tokens`;
      statusEl.textContent = lastBill;
      break;
    case "done":
      ovSet("done", "done");
      trAddNode("end", "✓ 完成", `${e.task_id} · 退回 ${e.rejects} 次`, { end: "end-ok" });
      showResultOk(e);
      break;
    case "direct_reply":
      statusEl.textContent = "调度岗：" + e.answer;
      trAddNode("end", "直接回复", (e.answer || "").slice(0, 20), { end: "end-ok" });
      showResultDirect(e);
      break;
    case "fail": {
      const stage = FAIL_STAGE[e.stage] || "done";
      ovSet(stage, "fail");
      ovSet("done", "fail");
      trAddNode("end", "✗ 失败", (e.reason || "").slice(0, 24), { end: "end-bad" });
      showResultFail(e);
      break;
    }
  }
}

  if (ovMode === "mermaid") {
    document.querySelectorAll("#ov-mermaid svg g.node")
      .forEach(n => n.classList.remove("lit-active", "lit-done", "lit-fail"));
    ovLit = [];
  } else {
    for (const n of OV_NODES) ovSet(n.key, "pending");
    document.getElementById("ov-loop").setAttribute("opacity", 0);
    document.getElementById("ov-loop-label").setAttribute("opacity", 0);
  }
  trace.innerHTML = "";
  resetLanes();
  trDrawLanes();
  trPrev = null;
  trRow = 0;
  lastBill = "";
}

async function playReplay() {
  clearTimeout(replayTimer);
  resetCharts();
  const file = document.getElementById("replaySel").value;
  statusEl.textContent = "加载 " + file + " ……";
  let events;
  try {
    const text = await (await fetch(file)).text();
    events = text.trim().split("\n").map(l => JSON.parse(l));
  } catch (err) {
    statusEl.textContent = "录播加载失败：" + err.message;
    return;
  }
  let i = 0;
  const step = () => {
    if (i >= events.length) { statusEl.textContent = "回放完毕" + (lastBill ? " ｜ " + lastBill : ""); return; }
    applyEvent(events[i++]);
    replayTimer = setTimeout(step, 750);
  };
  step();
}
document.getElementById("btnReplay").addEventListener("click", playReplay);

/* 清除：重置两张图与账单显示（等价于终端输入 clear 的视图效果） */
document.getElementById("btnClear").addEventListener("click", () => {
  clearTimeout(replayTimer);
  resetCharts();
  statusEl.textContent = "已清除运行视图";
});

/* ================= 直播模式：FastAPI 在就解锁输入框，与终端同一底层 ================= */
async function startRun(requirement) {
  const req = document.getElementById("req");
  clearTimeout(replayTimer);            // 直播与录播互斥，防事件交错
  resetCharts();
  req.disabled = true;
  statusEl.textContent = "运行中……";
  try {
    const res = await fetch("/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ requirement }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const chunks = buf.split("\n\n");
      buf = chunks.pop();
      for (const c of chunks) {
        const line = c.trim();
        if (line.startsWith("data: ")) {
          const e = JSON.parse(line.slice(6));
          e.seq = e.seq || "-";
          applyEvent(e);
        }
      }
    }
    statusEl.textContent = "运行结束" + (lastBill ? " ｜ " + lastBill : "");
  } catch (err) {
    statusEl.textContent = "运行失败：" + err.message;
  } finally {
    req.disabled = false;
  }
}

async function initLive() {
  const req = document.getElementById("req");
  const cfg = document.getElementById("configEdit");
  try {
    const r = await fetch("/config");         // FastAPI 在位：直播模式
    if (!r.ok) throw new Error("HTTP " + r.status);
    cfg.value = await r.text();
    cfg.readOnly = false;                     // 直播模式：配置可编辑保存
    req.disabled = false;
    req.placeholder = "输入需求，回车运行";
    document.getElementById("brand").classList.add("live");
    req.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" && req.value.trim()) startRun(req.value.trim());
    });
    statusEl.textContent = "直播模式就绪（与终端同一调度入口）";
    return true;
  } catch {
    fetch("/run_config.txt")                   // 纯静态服务：退回读配置文件（只读）
      .then(r => r.ok ? r.text() : Promise.reject(new Error(r.status)))
      .then(t => { cfg.value = t; })
      .catch(() => {
        cfg.value = "（未加载到配置——FastAPI 启动：python -m uvicorn web_server:app --port 8000）";
      });
    return false;
  }
}

/* ================= 汉堡抽屉：开合 + 配置保存 ================= */
const drawer = document.getElementById("drawer");
const mask = document.getElementById("mask");
document.getElementById("hamburger").addEventListener("click", () => {
  drawer.classList.add("open");
  mask.classList.add("open");
});
mask.addEventListener("click", () => {
  drawer.classList.remove("open");
  mask.classList.remove("open");
});
document.getElementById("btnSaveCfg").addEventListener("click", async () => {
  const hint = document.getElementById("cfgHint");
  if (document.getElementById("configEdit").readOnly) {
    hint.textContent = "静态服务模式不支持保存（需 FastAPI 启动）";
    return;
  }
  try {
    const res = await fetch("/config", {
      method: "POST",
      headers: { "Content-Type": "text/plain; charset=utf-8" },
      body: document.getElementById("configEdit").value,
    });
    const msg = (await res.text()).trim();
    hint.textContent = res.ok ? msg : ("保存失败：" + msg);
  } catch (err) {
    hint.textContent = "保存失败：" + err.message;
  }
});

/* ================= 总览图缩放：按钮 + 滚轮 ================= */
let ovScale = 1;
const OV_SCALE_MIN = 0.5, OV_SCALE_MAX = 3.5;
function applyOvZoom() {
  ovScale = Math.min(OV_SCALE_MAX, Math.max(OV_SCALE_MIN, ovScale));
  document.getElementById("ov-mermaid").style.transform = `scale(${ovScale})`;
  document.getElementById("ovScaleVal").textContent = Math.round(ovScale * 100) + "%";
}
document.getElementById("ovIn").addEventListener("click", () => { ovScale *= 1.2; applyOvZoom(); });
document.getElementById("ovOut").addEventListener("click", () => { ovScale /= 1.2; applyOvZoom(); });
document.getElementById("ovReset").addEventListener("click", () => { ovScale = 1; applyOvZoom(); });
document.getElementById("ov-zoom").addEventListener("wheel", (e) => {
  e.preventDefault();
  ovScale *= e.deltaY < 0 ? 1.12 : 0.9;
  applyOvZoom();
}, { passive: false });

/* ================= 入场动画：GSAP 优先，CSS 兜底 ================= */
function entrance() {
  const items = document.querySelectorAll(".rise");
  if (window.gsap && !window.__gsapFailed) {
    gsap.to(items, {
      opacity: 1, y: 0, duration: 0.7,
      stagger: 0.09, ease: "power3.out", clearProps: "transform,opacity",
      onComplete: () => items.forEach(n => n.classList.add("in")),
    });
  } else {
    items.forEach((n, i) => {
      n.style.transitionDelay = (i * 0.09) + "s";
      n.classList.add("in");
    });
  }
}

/* 直播模式不自动播录播（避免 /replay.jsonl 404 噪音）；静态模式自动播 */
entrance();
initLive().then((live) => {
  initOverview().then(() => { if (!live) playReplay(); });
});
</script>
